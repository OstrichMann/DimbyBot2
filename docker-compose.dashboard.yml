services:
    fluxer-dashboard:
        build:
            context: .
            dockerfile: Dockerfile.web
        image: ${WEB_IMAGE:-dimbybot-fluxer-dashboard:local}
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3000
            HOSTNAME: 0.0.0.0
            DATABASE_URL: ${FLUXER_DOCKER_DATABASE_URL:-}
            POSTGRES_INTERNAL_HOST: fluxer-db
            POSTGRES_DB: ${POSTGRES_DB:-dimbybot_fluxer}
            POSTGRES_USER: ${POSTGRES_USER:-fluxer}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            FLUXER_INSTANCE_ORIGIN: ${FLUXER_INSTANCE_ORIGIN:-https://fluxer.com}
            FLUXER_CLIENT_ID: ${FLUXER_CLIENT_ID}
            FLUXER_CLIENT_SECRET: ${FLUXER_CLIENT_SECRET}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            BOT_COMMAND_PREFIX: ${BOT_COMMAND_PREFIX:-!}
            API_PROXY_TARGET: http://fluxer-bot:3010
            BOT_API_PORT: 3010
            WEBSOCKET_CLIENT_URL: ${WEBSOCKET_CLIENT_URL:-}
        ports:
            - "${WEB_PUBLISH_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
        depends_on:
            fluxer-db:
                condition: service_healthy
            fluxer-bot:
                condition: service_healthy
        networks: [fluxer-internal]
