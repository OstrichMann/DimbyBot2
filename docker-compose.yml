name: dimbybot-fluxer

services:
    fluxer-db:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-dimbybot_fluxer}
            POSTGRES_USER: ${POSTGRES_USER:-fluxer}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a fresh POSTGRES_PASSWORD}
        volumes:
            - fluxer-postgres:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks: [fluxer-internal]

    fluxer-companion:
        image: quay.io/invidious/invidious-companion@sha256:298cad3da121cc6ee290f00e6cc02a64feb36085097a3bba03d88eaa31d4dafd
        restart: unless-stopped
        environment:
            HOST: 0.0.0.0
            PORT: 8282
            SERVER_SECRET_KEY: ${INVIDIOUS_COMPANION_KEY:?Set a fresh INVIDIOUS_COMPANION_KEY}
            SERVER_BASE_URL: http://fluxer-companion:8282
        volumes:
            - fluxer-companion-cache:/var/tmp/youtubei.js
        networks: [fluxer-internal]

    fluxer-cipher:
        image: ghcr.io/kikkia/yt-cipher@sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449
        restart: unless-stopped
        environment:
            OVERRIDE_PLAYER_VARIANT: IAS
            API_TOKEN: ${LAVALINK_YOUTUBE_CIPHER_PASSWORD:?Set a fresh cipher password}
        networks: [fluxer-internal]

    fluxer-spotify-tokener:
        image: ghcr.io/topi314/spotify-tokener@sha256:7841fa6144bd27b75b3ffc5d89c8201f833e0b9e2d3e8b4d5af8371504fd43f8
        restart: unless-stopped
        networks: [fluxer-internal]

    fluxer-metadata:
        build:
            context: ./Lavalink
        image: ${LAVALINK_IMAGE:-dimbybot-fluxer-metadata:local}
        restart: unless-stopped
        environment:
            LAVALINK_PORT: 2333
            LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Set a fresh metadata password}
            LAVALINK_YOUTUBE_CIPHER_URL: http://fluxer-cipher:8001
            LAVALINK_YOUTUBE_CIPHER_PASSWORD: ${LAVALINK_YOUTUBE_CIPHER_PASSWORD}
            LAVALINK_YOUTUBE_POT_TOKEN: ${LAVALINK_YOUTUBE_POT_TOKEN:-}
            LAVALINK_YOUTUBE_POT_VISITORDATA: ${LAVALINK_YOUTUBE_POT_VISITORDATA:-}
            LAVALINK_SPOTIFY_ENABLED: ${LAVALINK_SPOTIFY_ENABLED:-true}
            LAVALINK_SPOTIFY_CLIENT_ID: ${LAVALINK_SPOTIFY_CLIENT_ID:-}
            LAVALINK_SPOTIFY_CLIENT_SECRET: ${LAVALINK_SPOTIFY_CLIENT_SECRET:-}
            LAVALINK_SPOTIFY_COUNTRY_CODE: ${LAVALINK_SPOTIFY_COUNTRY_CODE:-US}
            LAVALINK_SPOTIFY_PLAYLIST_LOAD_LIMIT: ${LAVALINK_SPOTIFY_PLAYLIST_LOAD_LIMIT:-6}
            LAVALINK_SPOTIFY_ALBUM_LOAD_LIMIT: ${LAVALINK_SPOTIFY_ALBUM_LOAD_LIMIT:-6}
        volumes:
            - fluxer-metadata-plugins:/app/plugins
        healthcheck:
            test: ["CMD", "/bin/sh", "/app/healthcheck.sh"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 60s
        depends_on:
            fluxer-cipher:
                condition: service_started
            fluxer-spotify-tokener:
                condition: service_started
        networks: [fluxer-internal]

    fluxer-bot:
        build:
            context: .
        image: ${BOT_IMAGE:-dimbybot-fluxer-bot:local}
        restart: unless-stopped
        environment:
            NODE_ENV: production
            FLUXER_INSTANCE_ORIGIN: ${FLUXER_INSTANCE_ORIGIN:-https://fluxer.com}
            FLUXER_BOT_TOKEN: ${FLUXER_BOT_TOKEN:?Set FLUXER_BOT_TOKEN}
            FLUXER_CLIENT_ID: ${FLUXER_CLIENT_ID:?Set FLUXER_CLIENT_ID}
            FLUXER_CLIENT_SECRET: ${FLUXER_CLIENT_SECRET:?Set FLUXER_CLIENT_SECRET}
            BOT_COMMAND_PREFIX: ${BOT_COMMAND_PREFIX:-!}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a fresh BETTER_AUTH_SECRET}
            DATABASE_URL: ${FLUXER_DOCKER_DATABASE_URL:-}
            POSTGRES_INTERNAL_HOST: fluxer-db
            POSTGRES_DB: ${POSTGRES_DB:-dimbybot_fluxer}
            POSTGRES_USER: ${POSTGRES_USER:-fluxer}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            LAVALINK_ORIGIN: http://fluxer-metadata:2333
            LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
            INVIDIOUS_COMPANION_URL: http://fluxer-companion:8282
            INVIDIOUS_COMPANION_KEY: ${INVIDIOUS_COMPANION_KEY}
            BOT_API_HOST: 0.0.0.0
            BOT_API_PORT: 3010
            BOT_API_REQUIRE_PRIVATE_CLIENT_IP: "1"
        ports:
            - "${BOT_API_PUBLISH_HOST:-127.0.0.1}:${BOT_API_PORT:-3010}:3010"
        volumes:
            - fluxer-storage:/app/storage
        depends_on:
            fluxer-db:
                condition: service_healthy
            fluxer-metadata:
                condition: service_healthy
            fluxer-companion:
                condition: service_started
        networks: [fluxer-internal]

volumes:
    fluxer-postgres:
    fluxer-storage:
    fluxer-metadata-plugins:
    fluxer-companion-cache:

networks:
    fluxer-internal:
        driver: bridge
