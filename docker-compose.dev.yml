# Host execution: start the dependency services by name, then run the Bot and Dashboard with Yarn.
# Full container Bot development: include fluxer-bot when using `up`.
services:
    fluxer-db:
        ports:
            - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    fluxer-metadata:
        ports:
            - "127.0.0.1:${LAVALINK_HOST_PORT:-2334}:2333"
    fluxer-companion:
        ports:
            - "127.0.0.1:${COMPANION_HOST_PORT:-8283}:8282"
    fluxer-bot:
        build:
            context: .
            dockerfile: Dockerfile.dev
        image: dimbybot-fluxer-bot:dev
        command: ["yarn", "dev"]
        environment:
            NODE_ENV: development
        volumes:
            - ./:/app
            - /app/node_modules
            - /app/src/web/node_modules
            - /app/dist
