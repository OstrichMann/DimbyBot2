name: Fluxer CI

# This independent version validates locally and in CI; publication/deployment requires explicit setup.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    validate-node-lts:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Node.js 24
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: "24"
                  cache: "yarn"

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Install web dependencies
              run: yarn web:install --frozen-lockfile

            - name: Generate Prisma client
              run: yarn db:generate

            - name: Validate build inputs
              run: |
                  yarn typecheck
                  yarn lint
                  yarn prettier --check .
                  yarn test
                  yarn build:bot
                  yarn build:web
